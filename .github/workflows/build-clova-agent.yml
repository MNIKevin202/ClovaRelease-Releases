# Build the Clova Build Agent Windows installer AND publish it as a release, so
# the agent's built-in update check can find it.
#
# Runs in this PUBLIC repo (free Actions), checking out the PRIVATE ClovaRelease
# source with SOURCE_REPO_PAT so the source never becomes public. The installer
# is both uploaded as a run artifact and attached to a GitHub Release tagged
# agent-v<version>.
name: Build Clova Build Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout private ClovaRelease source
        uses: actions/checkout@v4
        with:
          repository: MNIKevin202/ClovaRelease
          token: ${{ secrets.SOURCE_REPO_PAT }}

      - name: Install Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build-agent/agent

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build the agent installer (NSIS)
        working-directory: build-agent/agent
        run: tauri build

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: clova-build-agent-installer
          path: build-agent/agent/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish as a GitHub Release (for the agent's update check)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./build-agent/agent/tauri.conf.json').version")
          TAG="agent-v$VER"
          EXE=$(ls build-agent/agent/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          echo "Publishing $TAG from $EXE"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$EXE" \
              --repo "${{ github.repository }}" \
              --title "Clova Build Agent v$VER" \
              --notes "Automated Clova Build Agent installer (Windows x64)."
          fi
